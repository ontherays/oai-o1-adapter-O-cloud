# =============================================================================
# oai-o1-adapter values — CU/DU SPLIT gNB (adapter points at the DU)
# Complete, self-contained. Deploy with:
#   helm install o1-cudu ~/oai-o1-adapter-helm-templates -n ravi-ns -f values-cudu.yaml
# Runs ALONGSIDE the monolithic adapter — DIFFERENT LB IP and node-id so the
# two never collide in MetalLB or in SMO.
#
# PREREQUISITES before deploying this:
#   1. Bind .107 on joule:  sudo ip addr add 192.168.206.107/32 dev eno12399
#      (add it to the o1-ip-bypass systemd unit so it survives reboot)
#   2. Confirm the DU exposes a telnet ClusterIP service; set telnet.host below
#      to that service's DNS name (placeholder used here — VERIFY it).
# =============================================================================

namespace: ravi-ns

image:
  repository: bmw.ece.ntust.edu.tw/ravi/oai-o1-adapter
  tag: dev-v5
  pullPolicy: Always

replicaCount: 1

# --- Scheduling: pinned to joule (radio node), tolerating its 5g-radio taint -
nodeSelector:
  kubernetes.io/hostname: joule
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "5g-radio"
    effect: "NoSchedule"
affinity: {}

# --- Northbound: how SMO (SDNC) reaches THIS adapter ------------------------
# .107 = the CU/DU adapter's own LB IP (must be bound on joule eno12399,
# distinct from the monolithic adapter's .106 and OCUDU's .105).
smo:
  advertisedHost: "192.168.206.107"
  netconfPort: 1830
  sftpPort: 1222

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.206.107"

# --- VES (adapter -> SMO collector, outbound) ------------------------------
ves:
  url: "http://192.168.8.69:30417/eventListener/v7"
  username: sample1
  password: sample1
  pnfRegistration: true
  heartbeatInterval: 30
  fileExpiry: 86400
  pmDataInterval: 30

# --- Southbound telnet: adapter -> DU telnet --------------------------------
# In the split, O1 attaches to the DU (num-ues / NRCellDU / BWP live there).
# Point at the DU's telnet ClusterIP service DNS name. VERIFY this against the
# actual DU management service you deploy (name/namespace may differ).
telnet:
  host: "oai-du-mgmt-external.ravi-ns.svc.cluster.local"
  port: 9090

# --- NETCONF credentials (must match image-baked netconf user) --------------
netconf:
  username: netconf
  password: "netconf!"

# --- Alarms -----------------------------------------------------------------
alarms:
  internalConnectionLostTimeout: 3
  loadDownlinkWarnThreshold: 50
  loadDownlinkWarnTimeout: 30

# --- Managed-element identity (CU/DU split — the DU) ------------------------
# Distinct nodeId from the monolithic adapter so SMO registers them separately.
# Set gnbDuId / gnbCuId to match the IDs your split DU/CU actually use.
info:
  gnbDuId: 3602
  gnbCuId: 0
  cellLocalId: 1
  granularityPeriod: 0
  fileReportingPeriod: 0
  nodeId: "oai-gnb-du"
  locationName: "NTUST BMW Lab, ECE, Taipei"
  managedBy: "ManagementSystem=O-RAN-SC-ONAP-based-SMO"
  managedElementType: "gNB-DU"
  model: "nr-softmodem"
  unitType: "gNB"

logLevel: 3
softwareVersion: "abcd"

pmStorage:
  enabled: false
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"